[package]
name = "moonlight-common"
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-or-later"

[dependencies]
bitflags = "2.9.1"
num = "0.4.3"
num-derive = "0.4.2"
num-traits = "0.2.19"

tracing = "0.1.44"

thiserror = "2.0.18"

uuid = { version = "1.23.4", features = ["v4", "js"] }
hex = "0.4.3"
pem = "3.0.6"
roxmltree = "0.21.1"
form_urlencoded = "1.2.2"
smallvec = "1.15.1"
bytes = "1.12.0"

# Stream Proto
sans-io-time = "0.2.0"
fec-rs = { version = "0.1.0", features = ["parallel"], optional = true }
rusty_enet = { version = "0.4.0", optional = true }

# Stream c

# Stream Std / Tokio
socket2 = { version = "0.6.5", optional = true }

# Stream Tokio
tokio = { version = "1.52.3", default-features = false, features = [
    "io-util",
    "net",
    "sync",
    "time",
    "macros",
], optional = true }
pin-project-lite = "0.2"

# -- Request clients
http = { version = "1.4.0", default-features = false, optional = true }
hyper = { version = "1.8.1", features = [
    "client",
    "http1",
], default-features = false, optional = true }

# ureq
ureq = { version = "3.2.0", features = [
    "rustls",
], default-features = false, optional = true }

# Hyper Client
rustls = { version = "0.23.37", default-features = false, optional = true }
hyper-util = { version = "0.1.20", features = [
    "client",
    "tracing",
], default-features = false, optional = true }
http-body-util = { version = "0.1.3", optional = true }
hyper-rustls = { version = "0.27.7", features = [
    "http1",
], default-features = false, optional = true }

# -- Crypto Backends
# OpenSSL
openssl = { version = "0.10.73", optional = true }

# Rustcrypto
sha1 = { version = "0.10.6", default-features = false, optional = true }
sha2 = { version = "0.10.9", features = [
    "oid",
], default-features = false, optional = true }
# rsa requires this rand version for private key generation
rand_v8 = { package = "rand", version = "0.8.5", default-features = false, optional = true }
# when generating js bindings we need get random
getrandom = { version = "0.2.17", features = ["js"] }
aes = { version = "0.8.4", default-features = false, optional = true }
rsa = { version = "0.9.10", features = [
    "std",
    "sha2",
], default-features = false, optional = true }
# must be this specific version because of some other crate
der = { version = "0.7.10", features = [
    "std",
], default-features = false, optional = true }
spki = { version = "0.7.3", features = [
    "std",
], default-features = false, optional = true }
x509-cert = { version = "0.2.5", features = [
    "std",
    "pem",
    "builder",
], default-features = false, optional = true }
pkcs8 = { version = "0.10.2", features = [
    "std",
], default-features = false, optional = true }
signature = { version = "2.2.0", features = [
    "std",
], default-features = false, optional = true }
aes-gcm = { version = "0.10.3", default-features = false, features = [
    "std",
    "aes",
], optional = true }
# this must match the aes version
cbc = { version = "0.1.2", default-features = false, features = [
    "std",
    "block-padding",
], optional = true }

# Webrtc
sdp-types = "0.1.8"

# serde serialization for some types
serde = { version = "1.0.228", features = ["derive"], optional = true }

[features]
http-client = ["dep:http"]
default = ["ureq", "std", "rustcrypto"]

serde = ["dep:serde"]

# Different "runtimes"
std = ["stream-proto", "dep:socket2"]
tokio = ["dep:tokio", "stream-proto", "dep:socket2"]

# Stream implementations
stream-proto = ["dep:fec-rs", "dep:rusty_enet"]
stream-c = []

# Crypto implementations
openssl = ["dep:openssl"]
rustcrypto = [
    "dep:sha1",
    "dep:sha2",
    "dep:rand_v8",
    "dep:aes",
    "dep:rsa",
    "dep:der",
    "dep:spki",
    "dep:x509-cert",
    "dep:signature",
    "dep:pkcs8",
    "dep:aes-gcm",
    "dep:cbc",
]

# Request implementations
ureq = ["dep:http", "dep:hyper", "dep:ureq"]
tokio-hyper = [
    "dep:http",
    "dep:rustls",
    "dep:hyper",
    "dep:hyper-util",
    "dep:http-body-util",
    "dep:hyper-rustls",
    "tokio",
]

# Logs sensitive information: e.g. private keys and sensitive values used in encryption / decryption
__tracing_sensitive = []



